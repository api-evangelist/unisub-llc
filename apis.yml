aid: unisub-llc
name: Unisub LLC
description: >-
  UniSub is a recurring crypto-payments platform that lets merchants accept
  automated on-chain subscriptions and deposits directly from customer wallets
  (MetaMask, WalletConnect, Coinbase Wallet) in USDT, USDC, DAI, WBTC, WETH and
  other ERC20/Polygon tokens across EVM-compatible chains. Subscriptions are
  executed by audited smart contracts, and merchants integrate through an
  embeddable payment widget, checkout links, or per-merchant API/webhooks, with
  a hosted dashboard for subscribers and analytics. A 500 Global portfolio
  company based in Batumi, Georgia, UniSub also publishes its SubscriptionApp
  smart contracts and a The Graph subgraph on GitHub.
