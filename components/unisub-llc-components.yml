name: UniSub Embeddable Components
description: >-
  UniSub's merchant integration is component-first: an embeddable payment
  widget and hosted checkout links rather than a documented public REST
  surface. The widget is configured from the merchant dashboard
  (app.unisub.io/merchant/new-widget) and embedded on the merchant's site to
  collect recurring crypto subscription payments wallet-to-wallet.
families:
