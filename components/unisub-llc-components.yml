        kind: embeddable-widget
        description: >-
          Embeddable subscription-payment widget merchants place on their own
          website; customers connect a wallet (MetaMask, WalletConnect,
          Coinbase Wallet) and approve a recurring on-chain subscription.
          Advertised on unisub.io ("customize embed widget") and created from
          the merchant dashboard at app.unisub.io/merchant/new-widget.
        evidence:
          - https://unisub.io
          - https://app.unisub.io/merchant/new-widget
      - name: Checkout links
        kind: hosted-surface
        description: >-
          Hosted checkout links merchants can share directly with customers as
          an alternative to embedding the widget ("customize embed widget and
          checkout links").
        evidence:
          - https://unisub.io
  - family: Dashboard
    components:
      - name: Merchant dashboard
        kind: hosted-dashboard
        description: >-
          Hosted merchant dashboard (app.unisub.io) for creating subscription
          orders, managing subscribers, viewing charge history, and analytics.
        evidence:
